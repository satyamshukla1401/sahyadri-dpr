<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Sahyadri DPR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sahyadri DPR">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #FFFFFF; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #cover { position: fixed; inset: 0; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 28px; text-align: center; transition: opacity .3s; }
  #cover.hide { opacity: 0; pointer-events: none; }
  #cover img { width: min(52vw, 190px); height: auto; }
  #cover p { margin: 0; font-size: 15px; font-weight: 600; color: #8E8E93; }
  #cover b { display: block; font-size: 19px; color: #111111; margin-bottom: 6px; }
  #retry { height: 46px; padding: 0 26px; border: 0; border-radius: 23px; background: #111111; color: #FFFFFF; font-size: 16px; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<iframe id="app" title="Project Sahyadri DPR" allow="geolocation *; camera *; microphone *; web-share *; clipboard-write *; fullscreen *"></iframe>
<div id="cover">
  <img src="cover-logo.png" alt="Project Sahyadri">
  <p id="msg">Daily progress report</p>
  <button type="button" id="retry" hidden>Try again</button>
</div>
<script>
  /* The Apps Script web app this wrapper opens. Change only this line if the web app link ever changes. */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbySoNkPyybiLacNmxqZd2Hlpa9oMWfFZOy7iSsWtmZ3X_bHafC60X72awyGgwwhw6OTAQ/exec';

  (function () {
    var frame = document.getElementById('app'), cover = document.getElementById('cover'),
        msg = document.getElementById('msg'), retry = document.getElementById('retry');
    function say(title, text, btn) { msg.innerHTML = '<b></b><span></span>'; msg.firstChild.textContent = title; msg.lastChild.textContent = text; retry.hidden = !btn; cover.classList.remove('hide'); }
    function load() {
      if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) { say('Setup needed', 'Open index.html and paste the web app URL in APP_URL.', false); return; }
      if (!navigator.onLine) { say('No internet', 'Connect to mobile data or Wi-Fi, then try again.', true); return; }
      msg.textContent = 'Daily progress report'; retry.hidden = true; cover.classList.remove('hide');
      /* ?page=dashboard on the app link opens the dashboard instead of the form */
      var q = /[?&]page=dashboard\b/.test(location.search) ? (APP_URL.indexOf('?') < 0 ? '?' : '&') + 'page=dashboard' : '';
      frame.src = APP_URL + q;
    }
    frame.addEventListener('load', function () { if (frame.src && frame.src !== 'about:blank') setTimeout(function () { cover.classList.add('hide'); }, 250); });
    retry.addEventListener('click', load);
    window.addEventListener('online', function () { if (!cover.classList.contains('hide')) load(); });
    load();
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  })();
</script>
</body>
</html>
